name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v6

      - name: 🚀 Run add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./ha-local-voice-assistant"
        continue-on-error: true   # remove this once config.yaml is clean
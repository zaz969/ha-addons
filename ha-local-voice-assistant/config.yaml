---
version: "1.1.12"
slug: ha_local_voice_assistant
name: Local Satellite Voice Assistant
description: Local voice assistant with wake word detection using linux-voice-assistant
url: https://github.com/zaz969/ha-local-voice-assistant
hassio_api: true
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
map:
  - share:rw
options:
  stop_model: "stop"
  wakeup_sound: ""
  timer_finished_sound: ""
  processing_sound: ""
  mute_sound: ""
  unmute_sound: ""
  continue_conversation_delay: 0
  timer_max_ring_seconds: 60
  enable_debug: false
schema:
  stop_model: str
  wakeup_sound: str?
  timer_finished_sound: str?
  processing_sound: str?
  mute_sound: str?
  unmute_sound: str?
  continue_conversation_delay: int(0,10000)
  timer_max_ring_seconds: int(0,900)
  enable_debug: bool
audio: true
devices:
  - /dev/snd
homeassistant: 2024.1.0
ports:
  '6053/tcp': 6053
image: ghcr.io/zaz969/ha-local-voice-assistant
